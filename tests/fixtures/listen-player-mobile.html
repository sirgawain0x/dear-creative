<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Listen player — mobile fixture</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
        background: #fafafa;
        padding: 12px;
        width: 390px;
      }
      .card {
        border-radius: 1rem;
        border: 1px solid rgb(228 228 231 / 0.9);
        background: linear-gradient(
          to right,
          rgb(250 250 250),
          rgb(244 244 245 / 0.6),
          rgb(250 250 250)
        );
        padding: 1rem;
        box-shadow: 0 1px 2px rgb(0 0 0 / 0.04);
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
      }
      .controls {
        display: flex;
        align-items: center;
        gap: 0.375rem;
      }
      .play {
        width: 2.5rem;
        height: 2.5rem;
        border-radius: 9999px;
        border: none;
        background: #18181b;
        color: white;
        font-size: 0.875rem;
      }
      .skip {
        border-radius: 0.5rem;
        border: 1px solid #e4e4e7;
        background: white;
        padding: 0.375rem 0.5rem;
        font-size: 0.75rem;
        font-weight: 500;
        color: #3f3f46;
      }
      .title {
        font-size: 0.875rem;
        font-weight: 500;
        margin: 0;
        color: #18181b;
      }
      .sub {
        font-size: 0.75rem;
        margin: 0.125rem 0 0;
        color: #71717a;
      }
      .speed {
        border-radius: 0.5rem;
        border: 1px solid #e4e4e7;
        background: white;
        padding: 0.25rem 0.5rem;
        font-size: 0.75rem;
        font-weight: 500;
      }
      .scrub {
        margin-top: 0.75rem;
        display: flex;
        align-items: center;
        gap: 0.75rem;
      }
      .time {
        width: 2.5rem;
        font-size: 0.75rem;
        font-variant-numeric: tabular-nums;
        color: #71717a;
      }
      .time.right {
        text-align: left;
      }
      .time.left {
        text-align: right;
      }
      .bar {
        flex: 1;
        height: 0.5rem;
        border-radius: 9999px;
        background: #e4e4e7;
        position: relative;
      }
      .fill {
        position: absolute;
        inset: 0 auto 0 0;
        width: 35%;
        border-radius: 9999px;
        background: #18181b;
      }
    </style>
  </head>
  <body>
    <div class="card" data-testid="listen-player-mobile">
      <div class="row">
        <div class="controls">
          <button type="button" class="skip" aria-label="Seek back 10 seconds">
            −10s
          </button>
          <button type="button" class="play" aria-label="Play audio narration">
            ▶
          </button>
          <button type="button" class="skip" aria-label="Seek forward 10 seconds">
            +10s
          </button>
        </div>
        <button type="button" class="speed">1x</button>
      </div>
      <div style="margin-top: 0.75rem">
        <p class="title">Listen to Dispatch</p>
        <p class="sub">Kokoro • ~2 min listen</p>
      </div>
      <div class="scrub">
        <span class="time left">0:42</span>
        <div
          class="bar"
          role="slider"
          aria-label="Playback position"
          aria-valuemin="0"
          aria-valuemax="120"
          aria-valuenow="42"
        >
          <div class="fill"></div>
        </div>
        <span class="time right">2:00</span>
      </div>
    </div>
  </body>
</html>
